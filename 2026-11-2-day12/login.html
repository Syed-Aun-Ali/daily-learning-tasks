<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Task &amp; Team Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          >Task &amp; Team Tracker</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
          aria-controls="menu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="features.html">Features</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Pages
              </a>
              <ul class="dropdown-menu dropdown-menu-dark">
                <li>
                  <a class="dropdown-item" href="features.html">Features</a>
                </li>
                <li>
                  <a class="dropdown-item" href="contact.html">Contact Us</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="login.html">Log in / Sign up</a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact Us</a>
            </li>
            <li class="nav-item">
              <a
                class="btn btn-outline-light btn-sm ms-lg-3"
                href="login.html"
                >Log in</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-11 col-md-7 col-lg-5">
            <div class="card border-0 shadow">
              <div class="card-body p-4 p-md-5">
                <ul class="nav nav-pills nav-justified mb-4" role="tablist">
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link active"
                      data-bs-toggle="pill"
                      data-bs-target="#login"
                      type="button"
                      role="tab"
                    >
                      Log in
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link"
                      data-bs-toggle="pill"
                      data-bs-target="#signup"
                      type="button"
                      role="tab"
                    >
                      Sign up
                    </button>
                  </li>
                </ul>

                <div class="tab-content">
                  <!-- Log in -->
                  <div
                    class="tab-pane fade show active"
                    id="login"
                    role="tabpanel"
                  >
                    <form action="#" method="post">
                      <div class="mb-3">
                        <label for="login-email" class="form-label"
                          >Email</label
                        >
                        <input
                          type="email"
                          class="form-control"
                          id="login-email"
                          placeholder="you@example.com"
                          required
                        />
                      </div>
                      <div class="mb-4">
                        <label for="login-password" class="form-label"
                          >Password</label
                        >
                        <input
                          type="password"
                          class="form-control"
                          id="login-password"
                          placeholder="••••••••"
                          required
                        />
                      </div>
                      <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                          Log in
                        </button>
                      </div>
                    </form>
                  </div>

                  <!-- Sign up -->
                  <div class="tab-pane fade" id="signup" role="tabpanel">
                    <form action="#" method="post">
                      <div class="mb-3">
                        <label for="signup-name" class="form-label"
                          >Full name</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="signup-name"
                          placeholder="Your name"
                          required
                        />
                      </div>
                      <div class="mb-3">
                        <label for="signup-email" class="form-label"
                          >Email</label
                        >
                        <input
                          type="email"
                          class="form-control"
                          id="signup-email"
                          placeholder="you@example.com"
                          required
                        />
                      </div>
                      <div class="mb-4">
                        <label for="signup-password" class="form-label"
                          >Password</label
                        >
                        <input
                          type="password"
                          class="form-control"
                          id="signup-password"
                          placeholder="At least 6 characters"
                          minlength="6"
                          required
                        />
                      </div>
                      <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                          Create Free Account
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>

            <p class="text-center text-muted small mt-3 mb-0">
              Free to start. No credit card needed.
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white-50 text-center py-3 small">
      <p class="mb-0">&copy; 2026 Task &amp; Team Tracker. Practice project.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
