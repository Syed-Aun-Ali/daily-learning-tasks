<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List — Task &amp; Team Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Task &amp; Team Tracker</a>
    </div>
  </nav>

  <!-- Main -->
  <main class="container py-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Task Management</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewTaskModal()">+ Add New Task</button>
    </div>

    <!-- Filters: status dropdown + search box -->
    <div class="row g-2 mb-3">
      <div class="col-auto">
        <select id="filterStatus" class="form-select" onchange="renderTasks()">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="col">
        <input
          type="search"
          id="searchText"
          class="form-control"
          placeholder="Search task name or assignee..."
          oninput="renderTasks()"
        />
      </div>
    </div>

    <!-- Table (rows rendered by script.js from the tasks array) -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col">#</th>
                <th scope="col">Task Name</th>
                <th scope="col">Assigned To</th>
                <th scope="col">Status</th>
                <th scope="col">Due Date</th>
                <th scope="col" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <p id="noResults" class="text-center text-muted mt-3 d-none">No tasks match your filter.</p>
  </main>

  <!-- ============ REUSABLE MODAL (Add & Edit) ============ -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalLabel">Create New Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="taskName" class="form-label">Task Name</label>
              <input type="text" class="form-control" id="taskName" placeholder="e.g., Fix Navigation Bug">
            </div>
            <div class="mb-3">
              <label for="assignedTo" class="form-label">Assigned To</label>
              <input type="text" class="form-control" id="assignedTo" placeholder="e.g., Asad">
            </div>
            <div class="mb-3">
              <label for="taskStatus" class="form-label">Status</label>
              <select class="form-select" id="taskStatus">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="dueDate" class="form-label">Due Date</label>
              <input type="date" class="form-control" id="dueDate">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveTask()">Save Task</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white-50 text-center py-3 small">
    <p class="mb-0">&copy; 2026 Task &amp; Team Tracker. Practice project.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
